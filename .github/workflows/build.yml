name: Build executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller playwright

      - name: Build executable
        run: |
          pyinstaller --onefile --noconsole --clean --name campus-auto-login ^
            --collect-all playwright --hidden-import playwright.sync_api ^
            --hidden-import tkinter campus_login.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: campus-auto-login-windows
          path: dist/campus-auto-login.exe

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/campus-auto-login.exe
          generate_release_notes: true
